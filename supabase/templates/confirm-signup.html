<!-- Supabase > Authentication > Emails > Templates > "Confirm sign up".
     Subject: Confirm your Valor account -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#060A1E;padding:40px 16px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#0E1120;border:1px solid #2A3A7A;border-radius:14px;">
        <tr>
          <td style="padding:36px 32px 8px;text-align:center;">
            <div style="font-size:28px;font-weight:bold;color:#F4F7FF;letter-spacing:-0.5px;">Valor</div>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 0;text-align:center;">
            <p style="margin:0;font-size:17px;font-weight:bold;color:#F4F7FF;">Confirm your email</p>
            <p style="margin:12px 0 0;font-size:14px;line-height:21px;color:#9AA6C4;">
              Press the button to confirm this address and finish creating your Valor account.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 32px;text-align:center;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2563FF;color:#FFFFFF;font-size:15px;font-weight:bold;text-decoration:none;padding:13px 32px;border-radius:8px;">Confirm email</a>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 32px;text-align:center;">
            <p style="margin:0;font-size:12px;line-height:18px;color:#6B7591;">
              If you didn't sign up for Valor, you can ignore this email.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
